name: MOVE Index Data Collector

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 평일 UTC 01:00 (한국시간 오전 10시)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run collector
        run: python collect_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/move_dashboard.json
          git diff --staged --quiet || git commit -m "chore: update MOVE dashboard data $(date -u +'%Y-%m-%d')"
          git push
